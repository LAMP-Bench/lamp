name: alpha-testing build

# Builds Lamp Bench on Windows, macOS (universal) and Ubuntu, signs the
# updater artifacts, and uploads everything to a DRAFT release on a private
# STAGING tag. Only once every platform finishes cleanly does `publish`
# promote that draft onto the public `alpha-testing` tag.
#
# The staging indirection matters. This workflow used to delete the live
# `alpha-testing` release as its very first step: for the ~30 minutes of the
# build there was no release at all (the in-app updater 404'd for every
# install, and the download page was empty), and a failing lint or a single
# red matrix job left users with nothing — the old release was already gone
# and no new one arrived. Now the live release is only touched in the last
# few seconds of a fully successful run.

on:
  workflow_dispatch:

# The tag the build uploads to. Never public, never referenced by the
# updater — safe to wipe and recreate on every run.
env:
  STAGING_TAG: alpha-staging
  CHANNEL_TAG: alpha-testing

permissions:
  contents: write

jobs:
  prepare:
    # Clear the staging slot so tauri-action's "find by tag" starts from a
    # clean draft instead of appending to last run's leftovers. Destructive
    # only towards a tag nothing points at.
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Clear the staging release + tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.STAGING_TAG;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );
            for (const r of releases.filter((r) => r.tag_name === tag)) {
              await github.rest.repos.deleteRelease({ owner, repo, release_id: r.id });
              core.notice(`Deleted stale staging release ${r.id}.`);
            }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
              core.notice(`Deleted stale tag ${tag}.`);
            } catch {
              core.notice(`No ${tag} tag to delete.`);
            }

  lint:
    # Cheap, fast gates that catch the usual breakage before we burn 20+
    # minutes on a three-OS native build matrix. TypeScript typecheck +
    # Rust clippy with warnings denied. Runs in parallel with prepare.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      # Catches a t() call whose key was never added (renders the raw key on
      # screen) and translations nobody references.
      - name: i18n consistency
        run: pnpm scripts:check-i18n

      - name: Rust clippy (warnings denied)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-deps -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  build:
    needs: [prepare, lint]
    strategy:
      # We want everyone's artifacts before publishing, so a failing
      # platform shouldn't cancel its siblings — they still upload to the
      # draft, the publish job below just won't flip it live.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-x86_64
            args: ''
          - platform: ubuntu-22.04
            label: linux-x86_64
            args: ''
          # One universal macOS build (Intel + Apple Silicon in a single
          # .dmg/.app) cross-compiled on the fast, always-available
          # Apple-Silicon runner. We used to have a separate macos-13 Intel
          # job, but those Intel runners sit in a multi-hour queue and were
          # blocking the publish gate (which needs every matrix job green).
          - platform: macos-latest
            label: darwin-universal
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    env:
      # Bundling Monaco (dd95413) produces a ~4 MB chunk, and minifying it
      # runs Node out of heap on the macOS runners, which have noticeably
      # less memory than the Linux and Windows ones — those two built the
      # same commit fine. Node sizes its default heap from available RAM, so
      # this only ever failed on one of the three.
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        # The runner OS only matters for the build environment — the
        # artifacts it emits target every desktop distro: .deb covers
        # Debian/Ubuntu/Mint/Pop!/Elementary, .rpm covers Fedora/RHEL/
        # openSUSE, and .AppImage runs on ANYTHING with glibc (Arch, void,
        # etc.). `rpm` is what teaches the Tauri bundler to emit the .rpm.
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            rpm

      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (both macOS arches for the universal build)
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin lipo's both arch slices, so the runner
          # needs both targets installed.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # NOTE: no `fetch-binaries` step. The installer has been slim since
      # 36593bf — `tauri.conf.json` maps no `resources/` into the bundle, and
      # the first-launch wizard downloads Apache/MySQL/PHP into the install
      # dir instead. Pulling ~350 MB here just to throw it away cost several
      # minutes of every Windows build.

      # Derive a strictly-increasing version from the run number so the
      # in-app updater actually fires. Installed builds sit at some
      # 0.1.<N>; each workflow run produces 0.1.<run_number> which is
      # always greater (run_number is monotonic per workflow). Patched into
      # all three manifests so the bundler, the updater's latest.json, and
      # the JS app_version agree. github.run_number is constant across the
      # whole run, so every matrix OS stamps the identical version.
      - name: Stamp build version
        shell: bash
        run: |
          VER="0.1.${{ github.run_number }}"
          echo "Stamping version $VER"
          node -e "const f='package.json',j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs');const f='src-tauri/Cargo.toml';let s=fs.readFileSync(f,'utf8');s=s.replace(/^version = \".*\"/m,'version = \"$VER\"');fs.writeFileSync(f,s)"

      - name: Build Tauri app + upload to the staging draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — must be set or tauri-action skips emitting
          # `latest.json` + `.sig` files and the in-app updater silently
          # 404s. The keypair was generated locally with
          # `pnpm tauri signer generate`; the .pub half is checked into
          # tauri.conf.json under plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Uploads land on the staging tag. `publish` moves the finished
          # draft onto the public channel tag; the version stamped above
          # (0.1.<run_number>) is what actually makes the updater fire, so we
          # deliberately do NOT create a tag per build.
          tagName: ${{ env.STAGING_TAG }}
          releaseName: 'Lamp Bench — alpha testing'
          # This body is written by whichever matrix entry creates the draft;
          # the others reuse it. Since `prepare` clears staging on every run,
          # it is rewritten from here each time.
          releaseBody: |
            **Rolling alpha build** for Lamp Bench.

            Pick the installer that matches your machine:
            - **Windows x64** — `.exe` (NSIS)
            - **macOS (Intel + Apple Silicon)** — `.dmg` or `.app.tar.gz` (universal)
            - **Linux Debian/Ubuntu/Mint** — `.deb`
            - **Linux Fedora/RHEL/openSUSE** — `.rpm`
            - **Any other Linux (Arch, etc.)** — `.AppImage`

            Built from commit `${{ github.sha }}`.
          # Drafts are invisible to humans and to the in-app updater, so a
          # partial upload can never be seen.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  publish:
    needs: build
    # success() is true only when EVERY matrix job in `needs` succeeded, so a
    # single red platform leaves the live release untouched and the staging
    # draft sitting there for a human to inspect.
    if: success()
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Promote the staging draft onto the channel tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const staging = process.env.STAGING_TAG;
            const channel = process.env.CHANNEL_TAG;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );
            const draft = releases.find(
              (r) => r.tag_name === staging && r.draft === true
            );
            if (!draft) {
              core.setFailed(`no ${staging} draft release to promote`);
              return;
            }

            // Only now — with every artifact uploaded and verified — do we
            // touch the live release. The gap where users have no download
            // is the couple of seconds between these two calls.
            for (const r of releases.filter((r) => r.tag_name === channel)) {
              await github.rest.repos.deleteRelease({ owner, repo, release_id: r.id });
              core.notice(`Removed previous ${channel} release ${r.id}.`);
            }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${channel}` });
            } catch {
              core.notice(`No ${channel} tag to delete.`);
            }

            // Retagging a *draft* is allowed (its tag doesn't exist yet), and
            // publishing creates the tag at target_commitish. Asset URLs
            // follow the release, so
            // /releases/download/alpha-testing/latest.json keeps resolving.
            const { data: published } = await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: draft.id,
              tag_name: channel,
              target_commitish: context.sha,
              draft: false,
              prerelease: true,
            });
            core.notice(`Published ${channel} (${published.html_url}).`);
