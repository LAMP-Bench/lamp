name: binaries manifest check

# Upstreams delete files out from under pinned URLs — windows.php.net purges
# superseded patch releases into /archives/, ApacheLounge keeps only its
# newest build. Nothing notices until a user clicks Install and gets an HTTP
# error, which is exactly the wrong moment. This runs weekly and opens an
# issue the first time a URL goes dark.

on:
  schedule:
    # Mondays, 06:00 UTC — a fresh report at the start of the week rather
    # than one buried in a weekend backlog.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe every pinned URL
        id: probe
        run: |
          set +e
          node ./scripts/check-binaries.mjs > report.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Open an issue for the dead URLs
        if: steps.probe.outputs.exit_code != '0'
        uses: actions/github-script@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const report = fs.readFileSync('report.txt', 'utf8');
            const title = 'Dead URLs in scripts/binaries.json';

            // One rolling issue rather than a new one every Monday: reopen
            // and comment if it already exists.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: 'binaries', per_page: 100,
            });
            const open = existing.find((i) => i.title === title && !i.pull_request);

            const body = [
              'The weekly manifest check found unreachable downloads.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            ].join('\n');

            if (open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.number, body,
              });
              if (open.state === 'closed') {
                await github.rest.issues.update({
                  owner, repo, issue_number: open.number, state: 'open',
                });
              }
              core.notice(`Updated issue #${open.number}.`);
            } else {
              const { data } = await github.rest.issues.create({
                owner, repo, title, body, labels: ['binaries'],
              });
              core.notice(`Opened issue #${data.number}.`);
            }

      - name: Fail the run when URLs are dead
        if: steps.probe.outputs.exit_code != '0'
        run: exit 1
